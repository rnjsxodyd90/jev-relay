name: Native iOS verification

on:
  push:
    paths:
      - "ios/**"
      - "!ios/**/*.md"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "!ios/**/*.md"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: Offline ${{ matrix.family }} tests
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        family: [iphone, ipad]
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify user-funded native architecture
        run: node ios/Scripts/verify-byok-architecture.mjs

      - name: Select installed Xcode 26 or newer
        id: xcode
        run: |
          set -euo pipefail
          selected="$(node <<'JS'
          const {readdirSync} = require('node:fs');
          const {spawnSync} = require('node:child_process');
          const candidates = [];
          for (const name of readdirSync('/Applications').filter(name => /^Xcode.*\.app$/.test(name))) {
            const app = '/Applications/' + name;
            const result = spawnSync('xcodebuild', ['-version'], {encoding: 'utf8', env: {...process.env, DEVELOPER_DIR: app + '/Contents/Developer'}});
            const output = result.stdout || '';
            const match = /Xcode\s+(\d+)(?:\.(\d+))?(?:\.(\d+))?/.exec(output);
            if (result.status !== 0 || !match || Number(match[1]) < 26 || /beta|release.candidate|\brc\b/i.test(name + ' ' + output)) continue;
            candidates.push({app, version: match.slice(1).map(value => Number(value || 0))});
          }
          candidates.sort((a, b) => { for (let i = 0; i < 3; i++) { const difference = b.version[i] - a.version[i]; if (difference) return difference; } return a.app.localeCompare(b.app); });
          if (!candidates.length) { console.error('::error::An installed stable Xcode 26 or newer is required. None was found.'); process.exit(1); }
          console.log(candidates[0].app);
          JS
          )"
          echo "DEVELOPER_DIR=$selected/Contents/Developer" >> "$GITHUB_ENV"
          echo "xcode_path=$selected" >> "$GITHUB_OUTPUT"
          echo "Selected $selected"

      - name: Record toolchain and SDK inventory
        run: |
          set -euo pipefail
          mkdir -p artifacts/toolchain
          {
            echo "Runner: $RUNNER_OS $RUNNER_ARCH"
            sw_vers
            echo
            xcodebuild -version
            echo
            swiftc --version
            echo
            xcodebuild -showsdks
          } | tee artifacts/toolchain/versions.txt
          xcrun simctl list devices available | tee artifacts/toolchain/available-simulators.txt
          {
            echo "### iOS toolchain (${{ matrix.family }})"
            echo '```text'
            cat artifacts/toolchain/versions.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Select an available ${{ matrix.family }} simulator
        id: simulator
        env:
          SIMULATOR_FAMILY: ${{ matrix.family }}
        run: |
          set -euo pipefail
          node <<'JS'
          const {appendFileSync} = require('node:fs');
          const {execFileSync} = require('node:child_process');
          const family = process.env.SIMULATOR_FAMILY;
          const inventory = JSON.parse(execFileSync('xcrun', ['simctl', 'list', 'devices', 'available', '-j'], {encoding: 'utf8'}));
          const devices = [];
          for (const [runtime, entries] of Object.entries(inventory.devices || {})) {
            const match = /SimRuntime\.iOS-(\d+)(?:-(\d+))?(?:-(\d+))?/.exec(runtime);
            if (!match || Number(match[1]) < 17) continue;
            const version = match.slice(1).map(value => Number(value || 0));
            for (const device of entries) {
              if (device.isAvailable === false) continue;
              const entry = {version, name: device.name || '', udid: device.udid || '', runtime};
              if (family === 'iphone' && entry.name.startsWith('iPhone')) devices.push({...entry, large: /Pro Max/.test(entry.name) ? 2 : /Plus/.test(entry.name) ? 1 : 0});
              if (family === 'ipad' && entry.name.startsWith('iPad')) devices.push({...entry, large: /13-inch/.test(entry.name) ? 2 : /12\.9-inch/.test(entry.name) ? 1 : 0});
            }
          }
          const selected = devices.sort((a, b) => { for (let i = 0; i < 3; i++) { const difference = b.version[i] - a.version[i]; if (difference) return difference; } return b.large - a.large || b.name.localeCompare(a.name, undefined, {numeric: true}); })[0];
          if (!selected) { console.error('::error::An available ' + family + ' simulator on iOS 17+ is required. See the simulator inventory.'); process.exit(1); }
          appendFileSync(process.env.GITHUB_OUTPUT, 'udid=' + selected.udid + '\nname=' + selected.name + '\nruntime=' + selected.runtime + '\n');
          const summary = '### Simulator selection\n- ' + family + ': ' + selected.name + ' (' + selected.runtime + ')\n';
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          console.log(summary);
          JS

      - name: Enable the software keyboard for input coverage
        run: defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false

      - name: Run offline unit and UI tests on ${{ matrix.family }}
        id: tests
        continue-on-error: true
        timeout-minutes: 25
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/results artifacts/logs artifacts/derived-data
          xcrun simctl boot "$SIMULATOR_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          rm -rf "artifacts/results/${{ matrix.family }}.xcresult" artifacts/derived-data/native
          NSUnbufferedIO=YES xcodebuild \
            -project ios/JevRelay.xcodeproj \
            -scheme JevRelay \
            -configuration Debug \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath artifacts/derived-data/native \
            -resultBundlePath "artifacts/results/${{ matrix.family }}.xcresult" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_IDENTITY=- \
            test 2>&1 | tee "artifacts/logs/${{ matrix.family }}-tests.log"
          # Ad-hoc simulator signing preserves the app identity/Keychain entitlements.
          # No Apple distribution identity or live provider credentials are used.

      - name: Export genuine XCTest screenshot attachments
        if: always()
        run: |
          set -u
          mkdir -p artifacts/screenshots artifacts/review
          result="artifacts/results/${{ matrix.family }}.xcresult"
          if [ -d "$result" ]; then
            summary="artifacts/review/${{ matrix.family }}-summary.json"
            if ! xcrun xcresulttool get test-results summary --path "$result" > "$summary"; then
              rm -f "$summary"
              echo "::warning::Could not export the compact test summary; complete results are preserved."
            fi
            output="artifacts/screenshots/${{ matrix.family }}"
            mkdir -p "$output"
            if ! xcrun xcresulttool export attachments --path "$result" --output-path "$output"; then
              echo "::warning::Could not export attachments from $result; the complete xcresult is still preserved."
            fi
          else
            echo "::warning::No xcresult bundle was created before the test command failed."
          fi
          find artifacts/screenshots -type f -print || true

      - name: Upload compact review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-review-evidence-${{ matrix.family }}-${{ github.run_attempt }}
          path: |
            artifacts/screenshots/**/*.png
            artifacts/screenshots/**/*.jpg
            artifacts/screenshots/**/*.jpeg
            artifacts/screenshots/**/manifest.json
            artifacts/review/**
            artifacts/logs/**
            artifacts/toolchain/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test results, logs, and toolchain
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-offline-test-results-${{ matrix.family }}-${{ github.run_attempt }}
          path: |
            artifacts/results/*.xcresult
            artifacts/logs/**
            artifacts/toolchain/**
          if-no-files-found: warn
          retention-days: 14

      - name: Shut down selected simulator
        if: always()
        run: |
          xcrun simctl shutdown "${{ steps.simulator.outputs.udid }}" 2>/dev/null || true

      - name: Report test status
        if: always()
        run: |
          {
            echo "### Offline ${{ matrix.family }} test status"
            echo "- Selected simulator: ${{ steps.simulator.outputs.name }} (${{ steps.simulator.outputs.runtime }})"
            echo "- Unit/UI tests: ${{ steps.tests.outcome }}"
            echo "- Screenshots are genuine XCTest attachments from the offline interpret screen, built-in phrasebook, and privacy/preferences UI. No inference result is created for screenshots."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.tests.outcome }}" != "success" ]; then
            echo "${{ matrix.family }} simulator test run failed. Inspect the preserved xcresult and logs." >&2
            exit 1
          fi
